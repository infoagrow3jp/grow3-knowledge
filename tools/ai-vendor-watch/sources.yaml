  - {id: gemini-api-docs, vendor: google, label: Gemini APIドキュメント, urls: ["https://ai.google.dev/gemini-api/docs/llms.txt"]}
  - {id: gemini-cli-docs, vendor: google, label: Gemini CLIドキュメント, urls: ["https://geminicli.com/llms.txt"]}

# 重点ページ（本文の変更を検知する）。一覧の正は各スキルの references/sources.md の表
# （根拠ID｜ページ｜URL｜確認日）で、collect.py がそこから読む。ここには、スキルの根拠に
# していないが変更を見張りたいページだけを足す（id / vendor / label / url）。
focus_pages: []
