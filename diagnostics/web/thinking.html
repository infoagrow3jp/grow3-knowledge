async function validateToken(token) {
  if (GAS_URL.includes("PASTE_V3_GAS_WEB_APP_URL_HERE")) {
    throw new Error("v3 GASのWebアプリURLが未設定です。");
  }
  const res = await fetch(GAS_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({ action: "validate", token_code: token, diag_type: DIAG_TYPE }),
  });
  const data = await res.json();
  return data;
}

async function recordResult({ token, info, scores, title, answersJson }) {
  if (GAS_URL.includes("PASTE_V3_GAS_WEB_APP_URL_HERE")) {
    throw new Error("v3 GASのWebアプリURLが未設定です。");
  }
  const res = await fetch(GAS_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({
      action: "record",
      diag_type: DIAG_TYPE,
      token_code: token,
      diag_date:  info.date,
      name:       info.name,
      birthdate:  info.birthdate,
      org:        info.org,
      dept:       info.dept,
      score_A:    scores.A,
      score_B:    scores.B,
      score_C:    scores.C,
      score_D:    scores.D,
      type_label: title,
      assessment_version: ASSESSMENT_VERSION,
      answers_json: answersJson,
    }),
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.message || "結果を保存できませんでした。");
  return data;
}

/* ── 思考特性マップ 形状記述 ────────── */
function getShapeDesc(scores, dominant) {
  const ranked = Object.entries(scores).sort(([,a],[,b])=>b-a);
  const [k1,v1]=ranked[0], [,v4]=ranked[3];
  const spread = v1 - v4;
  const domCount = dominant.length;
  const hasA=dominant.includes("A"), hasB=dominant.includes("B");
  const hasC=dominant.includes("C"), hasD=dominant.includes("D");
  const isDiagAC = hasA && hasC;
  const isDiagBD = hasB && hasD;

  // 均衡型（優勢なし or 全体が均等）
  if (domCount === 0 || spread < 35) {
    return {
      label:"均衡・バランス型",
      shape:"4象限がほぼ等しい「正方形に近い形」",
      text:"4つの視点がほぼ均等に分布しており、正方形に近い形を示しています。特定の象限だけが突出するというより、4つの思考の優先度が近いプロフィールです。場面によって、どの視点を使っているかを振り返ると自分の傾向をつかみやすくなります。"
    };
  }
  // 対角二重優勢 A↔C
  if (isDiagAC && domCount === 2) {
    return {
      label:"A・C 対角二重優勢型",
      shape:"論理（A）と共感（C）が対角に張り出した「横長のひし形」",
      text:"論理・分析（A）と共感・感性（C）という相反する2つの象限が同時に高く、横長のひし形を示しています。事実優先と感情優先という対照的な思考が共存するため、場面によって内的な葛藤が生じることがあります。この二面性は、事実と人の受け止めの両方を判断材料にしやすいプロフィールとして捉えられます。"
    };
  }
  // 対角二重優勢 B↔D
  if (isDiagBD && domCount === 2) {
    return {
      label:"B・D 対角二重優勢型",
      shape:"計画（B）と創造（D）が対角に張り出した「縦長のひし形」",
      text:"計画・堅実（B）と創造・直感（D）という相反する2つの象限が同時に高く、縦長のひし形を示しています。安定志向と変革志向という対照的な思考が共存するため、どちらを優先するか迷う場面が生じます。この両方が高いことは、変化を考える視点と実行の見通しを考える視点の両方に注意が向きやすいプロフィールとして捉えられます。"
    };
  }
  // 三重優勢型
  if (domCount >= 3) {
    const low = ranked[ranked.length-1][0];
    return {
      label:`三重優勢型（${Q[low].name}が相対的に低い）`,
      shape:`3象限が広く張り出した「${Q[low].name}方向が凹んだ形」`,
      text:`3つの象限が60点以上となり、${Q[low].name}（${low}）が4象限の中では相対的に低く出た形状です。必要な場面で${Q[low].name}の視点も意識的に問いとして加えると、見落としに気づきやすくなります。`
    };
  }
  // 隣接二重優勢型
  if (domCount === 2) {
    const [ka,kb] = dominant;
    return {
      label:`${Q[ka].name}・${Q[kb].name} 隣接二重優勢型`,
      shape:`${ka}・${kb}方向に偏って広がった「非対称な四角形」`,
      text:`${Q[ka].name}（${ka}）と${Q[kb].name}（${kb}）の2つが高く、その方向に偏った非対称な四角形を示しています。2つの思考の優先度が相対的に高く出ています。残りの2象限も必要な場面で問いとして意識すると、判断材料の幅を広げやすくなります。`
    };
  }
  // 単一優勢型
  return {
    label:`${Q[k1].name} 単一集中型`,
    shape:`${k1}方向に大きく伸びた「鋭い非対称形」`,
    text:`${Q[k1].name}（${k1}）の象限が際立って高く、その方向に大きく伸びた形状です。この視点を優先して使いやすいプロフィールです。他の象限は相対的に低く出ているため、必要な場面では異なる視点を意識的に加えると、見落としを減らしやすくなります。`
  };
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function calcScores(answers) {
  const raw = {A:0,B:0,C:0,D:0};
  Object.values(answers).forEach(q => { raw[q]++; });
  const total = Object.values(raw).reduce((a,b)=>a+b,0);
  const norm = {};
  Object.keys(raw).forEach(k => { norm[k] = Math.round(raw[k]/total*200); });
  const s = Object.values(norm).reduce((a,b)=>a+b,0);
  if (s !== 200) {
    const maxK = Object.keys(norm).reduce((a,b)=>norm[a]>norm[b]?a:b);
    norm[maxK] += (200-s);
  }
  return norm;
}

function getResultTitle(scores) {
  const ranked = Object.entries(scores).sort(([,a],[,b])=>b-a);
  const [top1] = ranked[0];
  const dominant = ranked.filter(([,v]) => v >= 60).map(([k]) => k);
  const dominantCount = dominant.length;
  const showKeys = dominantCount >= 2 ? dominant : [top1];

  const typeLabel = dominantCount >= 3 ? "三重優勢型"
                  : dominantCount === 2 ? "二重優勢型"
                  : dominantCount === 1 ? "優勢型"
                  : "傾向型";

  return dominantCount >= 2
    ? `${showKeys.map(k => Q[k].name).join(" × ")}　${typeLabel}`
    : `${Q[top1].name}　${typeLabel}`;
}

/* ── ダイヤモンドチャート ─────────────── */
function DiamondChart({ scores, size=240 }) {
  const cx=size/2, cy=size/2;
  const clamp = v => Math.min(v,100)/100;
  const sA=clamp(scores.A), sD=clamp(scores.D);
  const sB=clamp(scores.B), sC=clamp(scores.C);
  const pA=[cx-cx*sA, cy-cy*sA];
  const pD=[cx+cx*sD, cy-cy*sD];
  const pC=[cx+cx*sC, cy+cy*sC];
  const pB=[cx-cx*sB, cy+cy*sB];
  const pts=`${pA} ${pD} ${pC} ${pB}`;

  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}
      style={{display:"block",overflow:"visible"}}>
      {/* 象限背景 */}
      <rect x={0}  y={0}  width={cx} height={cy} fill={Q.A.bg} opacity="0.7"/>
      <rect x={cx} y={0}  width={cx} height={cy} fill={Q.D.bg} opacity="0.7"/>
      <rect x={0}  y={cy} width={cx} height={cy} fill={Q.B.bg} opacity="0.7"/>
      <rect x={cx} y={cy} width={cx} height={cy} fill={Q.C.bg} opacity="0.7"/>
      {/* グリッド線 */}
      <line x1={cx} y1={0} x2={cx} y2={size} stroke="rgba(0,0,0,0.15)" strokeWidth="1"/>
      <line x1={0} y1={cy} x2={size} y2={cy} stroke="rgba(0,0,0,0.15)" strokeWidth="1"/>
      {[0.25,0.5,0.75,1.0].map(lv=>{
        const gA=[cx-cx*lv,cy-cy*lv],gD=[cx+cx*lv,cy-cy*lv];
        const gC=[cx+cx*lv,cy+cy*lv],gB=[cx-cx*lv,cy+cy*lv];
        return <polygon key={lv} points={`${gA} ${gD} ${gC} ${gB}`}
          fill="none" stroke="rgba(0,0,0,0.12)"
          strokeWidth={lv===1?"1":"0.5"} strokeDasharray={lv<1?"3,3":""}/>;
      })}
      {/* 対角軸 */}
      {[[0,0],[size,0],[0,size],[size,size]].map(([x,y],i)=>
        <line key={i} x1={cx} y1={cy} x2={x} y2={y}
          stroke="rgba(0,0,0,0.1)" strokeWidth="0.5" strokeDasharray="4,4"/>
      )}
      {/* スコアポリゴン */}
      <polygon points={pts} fill="rgba(30,70,160,0.2)"
        stroke="#1e3a6e" strokeWidth="2.5" strokeLinejoin="round"/>
      {/* 頂点 */}
      {[{p:pA,k:"A"},{p:pD,k:"D"},{p:pC,k:"C"},{p:pB,k:"B"}].map(({p,k})=>(
        <g key={k}>
          <circle cx={p[0]} cy={p[1]} r="8" fill={Q[k].color} opacity="0.2"/>
          <circle cx={p[0]} cy={p[1]} r="5" fill={Q[k].color} stroke="white" strokeWidth="2"/>
        </g>
      ))}
      {/* スコア数値 */}
      <text x="5"      y="16"       fontSize="13" fontWeight="800" fill={Q.A.color}>{scores.A}</text>
      <text x={size-5} y="16"       fontSize="13" fontWeight="800" fill={Q.D.color} textAnchor="end">{scores.D}</text>
      <text x="5"      y={size-4}   fontSize="13" fontWeight="800" fill={Q.B.color}>{scores.B}</text>
      <text x={size-5} y={size-4}   fontSize="13" fontWeight="800" fill={Q.C.color} textAnchor="end">{scores.C}</text>
      {/* 象限ラベル */}
      <text x="8"       y={cy-6}  fontSize="10" fontWeight="800" fill={Q.A.color} opacity="0.8">A</text>
      <text x={size-8}  y={cy-6}  fontSize="10" fontWeight="800" fill={Q.D.color} textAnchor="end" opacity="0.8">D</text>
      <text x="8"       y={cy+15} fontSize="10" fontWeight="800" fill={Q.B.color} opacity="0.8">B</text>
      <text x={size-8}  y={cy+15} fontSize="10" fontWeight="800" fill={Q.C.color} textAnchor="end" opacity="0.8">C</text>
    </svg>
  );
}

/* ── 設問表示位置のバランス調整 ─────────
   6つの象限ペアそれぞれで3問ずつ左右を反転。
   「左を選びやすい／右を選びやすい」という位置バイアスが
   特定象限の得点へそのまま乗らないようにする。
*/
function prepareQuestions() {
  const flipPattern = [false,true,false,true,false,true];
  return shuffle(QUESTIONS_DATA.map(q => {
    const flip = flipPattern[(q.id - 1) % 6];
    return flip ? {...q, left:q.right, right:q.left} : {...q};
  }));
}

        const finalTitle = getResultTitle(finalScores);
        setIsResponseBiased(allSameSide);
        setScores(finalScores);
        setAutoRecordStatus("sending");
        const answersJson = JSON.stringify({
          answers: newAns,
          sides: newSides,
          response_biased: allSameSide,
        });
        recordResult({ token, info, scores: finalScores, title: finalTitle, answersJson })
          .then(() => setAutoRecordStatus("saved"))
          .catch(() => setAutoRecordStatus("error"));
        setTimeout(()=>setPhase("result"), 150);

              点数は4象限の中での相対的な配分です。能力・適性や、他者より優れている／劣っていることを示すものではありません。
            </p>
            {/* 保存処理は通常時は表示せず、失敗時だけ受験者へ案内する */}
            {autoRecordStatus === "error" && (
              <div style={{
                background:"#fff8f0",borderRadius:"10px",padding:"10px 14px",marginBottom:"20px",
                border:"0.5px solid #F3D7B0",borderLeft:"4px solid #c47a0a",
              }}>
                <p style={{fontSize:"12px",color:"#7a4a00",lineHeight:"1.7",margin:0,fontWeight:"600"}}>
                  結果の保存に失敗しました。画面を閉じず、担当者にお知らせください。
                </p>
              </div>
            )}

            {/* チャート */}
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",marginBottom:"24px"}}>
              <div style={{display:"flex",justifyContent:"space-between",width:"240px",marginBottom:"5px"}}>
                <span style={{fontSize:"11px",fontWeight:"800",color:Q.A.color}}>A {Q.A.name}</span>
                <span style={{fontSize:"11px",fontWeight:"800",color:Q.D.color}}>{Q.D.name} D</span>
              </div>
              <DiamondChart scores={scores} size={240}/>
              <div style={{display:"flex",justifyContent:"space-between",width:"240px",marginTop:"5px"}}>
                <span style={{fontSize:"11px",fontWeight:"800",color:Q.B.color}}>B {Q.B.name}</span>
                <span style={{fontSize:"11px",fontWeight:"800",color:Q.C.color}}>{Q.C.name} C</span>
              </div>
            </div>

            {/* 回答偏りの通知 */}
            {isResponseBiased && (
              <div style={{
                background:"#fff8f0",borderRadius:"10px",padding:"12px 16px",
                marginBottom:"16px",
                border:"0.5px solid #e8c88a",
                borderLeft:"4px solid #c47a0a",
              }}>
                <div style={{fontSize:"12px",fontWeight:"600",color:"#c47a0a",marginBottom:"4px"}}>
                  ⚠ 回答に偏りが見られました
                </div>
                <p style={{fontSize:"12px",color:"#2B2F33",lineHeight:"1.75",margin:0}}>
                  すべての選択肢が同じ方向に偏っていたため、スコアは参考値として均等表示しています。もう一度、ご自身のペースで回答してみてください。
                </p>
              </div>
            )}

            {/* タイプ説明 */}
            <div style={{
              background:"#EEF3FA",
              borderRadius:"12px",padding:"16px 20px",marginBottom:"18px",
              borderLeft:`4px solid #0F3D96`,
              border:"0.5px solid #B5D4F4",
              borderLeftWidth:"4px",borderLeftColor:"#0F3D96",
            }}>
              <div style={{fontSize:"16px",fontWeight:"600",color:"#0F3D96",marginBottom:"8px"}}>
                {title}
              </div>
              <p style={{color:"#2B2F33",fontSize:"13px",lineHeight:"1.85",margin:0}}>{desc}</p>
            </div>

            {/* スコア */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"24px"}}>
              {ranked.map(([k,v],i)=>(
                <div key={k} style={{
                  background:Q[k].bg,borderRadius:"12px",padding:"14px 16px",
                  borderLeft:`4px solid ${Q[k].color}`,
                  display:"flex",justifyContent:"space-between",alignItems:"center",
                  border:`1.5px solid ${dominant.includes(k)?Q[k].color+"80":"transparent"}`,
                  borderLeftWidth:"4px",borderLeftColor:Q[k].color,
                }}>
                  <div>
                    <div style={{fontSize:"10px",fontWeight:"800",color:Q[k].color,marginBottom:"3px",display:"flex",alignItems:"center",gap:"5px"}}>
                      #{i+1} {k} {Q[k].emoji}
                      {dominant.includes(k) && (
                        <span style={{background:Q[k].color,color:"white",fontSize:"9px",
                          padding:"1px 5px",borderRadius:"10px",fontWeight:"700"}}>優勢</span>
                      )}
                    </div>
                    <div style={{fontSize:"13px",fontWeight:"700",color:"#334"}}>{Q[k].name}</div>
                  </div>
                  <div style={{fontSize:"24px",fontWeight:"700",color:Q[k].color,lineHeight:1}}>{v}</div>
                </div>
              ))}
            </div>

            {/* 個人情報入力 */}
            <div style={{background:"#f8fafc",borderRadius:"14px",padding:"20px",marginBottom:"22px",
              border:"1.5px solid #e0e8f0"}}>
              <h3 style={{fontSize:"14px",fontWeight:"700",color:"#1a2740",marginBottom:"16px",
                paddingBottom:"10px",borderBottom:"1px solid #e0e8f0"}}>
                📝 結果シートに記載する情報
              </h3>
              <div style={{background:"#EEF3FA",borderRadius:"8px",padding:"8px 12px",marginBottom:"14px",fontSize:"11px",color:"#556",lineHeight:1.6}}>
                ここでの変更はPDF表示にのみ反映されます。
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px"}}>
                <div>
                  <label style={labelStyle}>診断日</label>
                  <input style={inputStyle} value={info.date}
                    onChange={e=>setInfo({...info,date:e.target.value})} placeholder="例：2025/4/30"/>
                </div>
                <div>
                  <label style={labelStyle}>氏名</label>
                  <input style={inputStyle} value={info.name}
                    onChange={e=>setInfo({...info,name:e.target.value})} placeholder="例：山田 太郎"/>
                </div>
                <div>
                  <label style={labelStyle}>所属組織</label>
                  <input style={inputStyle} value={info.org}
                    onChange={e=>setInfo({...info,org:e.target.value})} placeholder="例：株式会社○○"/>
                </div>
                <div style={{gridColumn:"1 / -1"}}>
                  <label style={labelStyle}>所属部署</label>
                  <input style={inputStyle} value={info.dept}
                    onChange={e=>setInfo({...info,dept:e.target.value})} placeholder="例：営業部 第一課"/>
                </div>
              </div>
            </div>

            {/* 振り返りの問い */}
            <div style={{
              background:"white",borderRadius:"12px",padding:"20px",marginBottom:"22px",
              borderLeft:"4px solid #0F3D96",
              border:"0.5px solid #B5D4F0",
              borderLeftWidth:"4px",borderLeftColor:"#0F3D96",
              boxShadow:"0 4px 16px rgba(15,61,150,0.06)",
            }}>
              <h3 style={{fontSize:"14px",fontWeight:"600",color:"#0F3D96",marginBottom:"14px",
                paddingBottom:"8px",borderBottom:"0.5px solid #D8E2F0"}}>
                振り返りの問い
              </h3>
              {[
                "この結果で、しっくりくるところはどこですか？",
                "少し意外だったところはどこですか？",
                "他の人と仕事を進めるとき、意識したいことは何ですか？",
              ].map((q,i)=>(
                <div key={i} style={{display:"flex",gap:"10px",marginBottom:i<2?"10px":0}}>
                  <span style={{
                    flexShrink:0,width:"22px",height:"22px",borderRadius:"50%",
                    background:"#EEF3FA",color:"#0F3D96",fontSize:"11px",fontWeight:"600",
                    display:"flex",alignItems:"center",justifyContent:"center",
                  }}>{i+1}</span>
                  <p style={{fontSize:"13px",color:"#2B2F33",lineHeight:"1.7",margin:0}}>{q}</p>
                </div>
              ))}
            </div>

            {/* ボタン */}
            <button onClick={() => window.print()} style={{
              width:"100%",padding:"15px",border:"none",borderRadius:"12px",
              background:"#0F3D96",
              color:"white",fontSize:"15px",fontWeight:"600",
              cursor:"pointer",
              marginBottom:"10px",letterSpacing:"0.03em",
            }}>
              PDFで保存（印刷）
            </button>
            <p style={{textAlign:"center",fontSize:"11.5px",color:"#aab",marginBottom:"14px"}}>
              印刷ダイアログで「PDFに保存」を選択してください
            </p>
            <button onClick={restart} style={{
              width:"100%",padding:"13px",border:"0.5px solid #D8E2F0",borderRadius:"12px",
              background:"white",color:"#2B2F33",fontSize:"14px",fontWeight:"500",cursor:"pointer",
            }}>
              もう一度診断する
            </button>
          </div>
        </div>

        {/* ══ 印刷専用レイアウト（A4） ══════════════ */}
        <div className="print-sheet" style={{
          width:"100%",background:"white",
          fontFamily:"'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,sans-serif",
        }}>
          {/* ヘッダー */}
          <div style={{
            background:"#0F3D96",
            color:"white",padding:"7px 13px",borderRadius:"5px",
            marginBottom:"7px",display:"flex",alignItems:"center",justifyContent:"space-between",
          }}>
            <div>
              <div style={{fontSize:"13px",fontWeight:"700",letterSpacing:"0.04em"}}>思考特性の結果</div>
              <div style={{fontSize:"8.5px",opacity:0.75,marginTop:"1px",letterSpacing:"0.1em"}}>THINKING PREFERENCES — Grow3 Inc.</div>
            </div>
            <div style={{fontSize:"8.5px",opacity:0.75}}>合計スコア：200点</div>
          </div>

          {/* 個人情報テーブル */}
          <table style={{width:"100%",borderCollapse:"collapse",marginBottom:"7px",
            border:"1px solid #ccd6e0",fontSize:"10px"}}>
            <tbody>
              <tr>
                {[["診断日",info.date,"12%","38%"],["氏名",info.name,"12%","38%"]].map(([label,val,lw,vw])=>(
                  <React.Fragment key={label}>
                    <td style={{background:"#f0f4f8",padding:"4px 7px",fontWeight:"700",color:"#556",
                      borderRight:"1px solid #ccd6e0",borderBottom:"1px solid #ccd6e0",
                      whiteSpace:"nowrap",width:lw}}>{label}</td>
                    <td style={{padding:"4px 8px",borderRight:"1px solid #ccd6e0",
                      borderBottom:"1px solid #ccd6e0",width:vw}}>{val||"　"}</td>
                  </React.Fragment>
                ))}
              </tr>
              <tr>
                <td style={{background:"#f0f4f8",padding:"4px 7px",fontWeight:"700",color:"#556",
                  borderRight:"1px solid #ccd6e0",whiteSpace:"nowrap"}}>所属組織</td>
                <td style={{padding:"4px 8px",borderRight:"1px solid #ccd6e0"}}>{info.org||"　"}</td>
                <td style={{background:"#f0f4f8",padding:"4px 7px",fontWeight:"700",color:"#556",
                  borderRight:"1px solid #ccd6e0",whiteSpace:"nowrap"}}>所属部署</td>
                <td style={{padding:"4px 8px"}}>{info.dept||"　"}</td>
              </tr>
            </tbody>
          </table>

          {/* メインエリア：チャート＋スコア */}
          <div style={{display:"flex",gap:"10px",marginBottom:"7px",alignItems:"flex-start"}}>
            {/* チャート */}
            <div style={{flexShrink:0}}>
              <div style={{fontSize:"8.5px",fontWeight:"800",color:"#556",
                textAlign:"center",marginBottom:"3px",letterSpacing:"0.08em"}}>思考特性マップ</div>
              <div style={{display:"flex",justifyContent:"space-between",width:"175px",marginBottom:"2px"}}>
                <span style={{fontSize:"7.5px",fontWeight:"800",color:Q.A.color}}>A {Q.A.name}</span>
                <span style={{fontSize:"7.5px",fontWeight:"800",color:Q.D.color}}>{Q.D.name} D</span>
              </div>
              <DiamondChart scores={scores} size={175}/>
              <div style={{display:"flex",justifyContent:"space-between",width:"175px",marginTop:"2px"}}>
                <span style={{fontSize:"7.5px",fontWeight:"800",color:Q.B.color}}>B {Q.B.name}</span>
                <span style={{fontSize:"7.5px",fontWeight:"800",color:Q.C.color}}>{Q.C.name} C</span>
              </div>
            </div>

            {/* スコア一覧 */}
            <div style={{flex:1}}>
              <div style={{fontSize:"8.5px",fontWeight:"800",color:"#556",
                marginBottom:"4px",letterSpacing:"0.08em"}}>スコア一覧</div>
              <div style={{display:"flex",flexDirection:"column",gap:"4px",marginBottom:"7px"}}>
                {ranked.map(([k,v],i)=>(
                  <div key={k} style={{
                    background:Q[k].bg,borderRadius:"5px",padding:"5px 9px",
                    display:"flex",justifyContent:"space-between",alignItems:"center",
                    border:`1.5px solid ${dominant.includes(k)?Q[k].color+"80":"#e0eaf0"}`,
                    borderLeftWidth:"3px",borderLeftColor:Q[k].color,borderLeftStyle:"solid",
                  }}>
                    <div style={{display:"flex",alignItems:"center",gap:"4px"}}>
                      <span style={{fontSize:"9.5px",fontWeight:"800",color:Q[k].color}}>#{i+1} {k}</span>
                      <span style={{fontSize:"9.5px",fontWeight:"600",color:"#445"}}>{Q[k].name}</span>
                      {dominant.includes(k) && (
                        <span style={{background:Q[k].color,color:"white",fontSize:"7.5px",
                          padding:"1px 4px",borderRadius:"8px",fontWeight:"700"}}>優勢</span>
                      )}
                    </div>
                    <span style={{fontSize:"17px",fontWeight:"900",color:Q[k].color,lineHeight:1}}>{v}</span>
                  </div>
                ))}
              </div>
              {/* 処理スタイル指標 */}
              {(()=>{
                const lr=scores.A+scores.B, rl=scores.C+scores.D;
                const pct=Math.round(lr/(lr+rl)*100);
                return (
                  <div style={{background:"#f8fafc",borderRadius:"5px",padding:"5px 9px",
                    border:"1px solid #dde6f0"}}>
                    <div style={{fontSize:"8.5px",fontWeight:"700",color:"#556",
                      marginBottom:"3px",letterSpacing:"0.05em"}}>処理スタイル指標（参考）</div>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:"3px",fontSize:"8.5px"}}>
                      <span style={{color:"#1a5f9e",fontWeight:"700"}}>分析・計画系 {pct}%</span>
                      <span style={{color:"#b83228",fontWeight:"700"}}>共感・創造系 {100-pct}%</span>
                    </div>
                    <div style={{background:"#dde6f0",borderRadius:"3px",height:"5px",overflow:"hidden"}}>
                      <div style={{width:`${pct}%`,height:"100%",
                        background:"#0F3D96"}}/>
                    </div>
                  </div>
                );
              })()}
            </div>
          </div>

          {/* ── 思考特性マップ 形状の特徴 ── */}
          <div style={{
            border:"1.5px solid #b0bcd0",borderRadius:"6px",
            overflow:"hidden",marginBottom:"7px",
          }}>
            <div style={{
              background:"#0F3D96",
              padding:"5px 11px",display:"flex",alignItems:"center",gap:"8px",
            }}>
              <span style={{fontSize:"10.5px",fontWeight:"700",color:"white",letterSpacing:"0.04em"}}>
                思考特性マップの形状特徴　―　{shapeDesc.label}
              </span>
            </div>
            <div style={{
              background:"#EEF3FA",
              padding:"7px 11px",display:"flex",gap:"10px",alignItems:"flex-start",
            }}>
              <div style={{
                flexShrink:0,background:"white",border:"1px solid #c8d8e8",
                borderRadius:"5px",padding:"4px 8px",fontSize:"9px",
                color:"#3a5a7a",fontWeight:"700",lineHeight:"1.5",
                textAlign:"center",minWidth:"80px",
              }}>
                {shapeDesc.shape.split("「").map((s,i)=>
                  i===0 ? <div key={i}>{s}</div>
                        : <div key={i} style={{color:"#1a5f9e",fontWeight:"800"}}>「{s}</div>
                )}
              </div>
              <p style={{fontSize:"9.5px",color:"#334",lineHeight:"1.65",margin:0,flex:1}}>
                {shapeDesc.text}
              </p>
            </div>
          </div>

          {/* ── 特性解説セクション ── */}
          <div style={{
            border:`1.5px solid ${Q[show1].color}40`,
            borderRadius:"6px",overflow:"hidden",marginBottom:"6px",
          }}>
            {/* セクションヘッダー */}
            <div style={{
              background:"#0F3D96",
              padding:"5px 11px",display:"flex",alignItems:"center",gap:"5px",
            }}>
              <span style={{fontSize:"10.5px",fontWeight:"700",color:"white",letterSpacing:"0.03em"}}>
                {title}　特性解説
              </span>
            </div>
            {/* 概要 */}
            <div style={{
              background:"#EEF3FA",
              padding:"6px 11px",borderBottom:"1px solid #D8E2F0",
            }}>
              <p style={{color:"#334",fontSize:"9.5px",lineHeight:"1.6",margin:0}}>{desc}</p>
            </div>

            {/* 詳細グリッド */}
            {showKeys.map(k => {
              const d = TYPE_DETAILS[k];
              if (!d) return null;
              return (
                <div key={k} style={{padding:"6px 11px",borderBottom:"1px solid #eef2f7"}}>
                  {/* キーワード行 */}
                  <div style={{display:"flex",alignItems:"center",gap:"4px",marginBottom:"5px",flexWrap:"wrap"}}>
                    <span style={{fontSize:"9px",fontWeight:"800",color:Q[k].color,
                      letterSpacing:"0.05em"}}>{k} {Q[k].name}</span>
                    {d.keywords.map(kw=>(
                      <span key={kw} style={{
                        background:Q[k].bg,color:Q[k].color,fontSize:"8.5px",fontWeight:"700",
                        padding:"1px 5px",borderRadius:"10px",border:`1px solid ${Q[k].color}40`,
                      }}>{kw}</span>
                    ))}
                  </div>
                  {/* 4ボックス */}
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"4px"}}>
                    {[
                      {bg:"#f0f7f0",bc:"#2a7a50",icon:"💪",label:"自然に使いやすい視点",text:d.strength},
                      {bg:"#fff8f0",bc:"#c47a0a",icon:"⚠",label:"補うとよい視点",text:d.weakness},
                      {bg:"#f0f4fa",bc:"#1a5f9e",icon:"👥",label:"チームで活かせる視点",text:d.teamrole},
                      {bg:"#faf0f4",bc:"#b83228",icon:"💡",label:"さらに活かすヒント",text:d.hint},
                    ].map(({bg,bc,icon,label,text})=>(
                      <div key={label} style={{
                        background:bg,borderRadius:"4px",padding:"5px 7px",
                        borderLeft:`2.5px solid ${bc}`,
                      }}>
                        <div style={{fontSize:"8.5px",fontWeight:"800",color:bc,
                          marginBottom:"2px",letterSpacing:"0.03em"}}>{icon} {label}</div>
                        <p style={{fontSize:"9px",color:"#334",lineHeight:"1.55",margin:0}}>{text}</p>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>

          {/* フッター */}
          <div style={{
            borderTop:"1px solid #D8E2F0",paddingTop:"5px",marginTop:"5px",
          }}>
            {/* 振り返りの問い */}
            <div style={{
              border:"1px solid #B5D4F0",borderLeft:"3px solid #0F3D96",
              borderRadius:"4px",padding:"5px 9px",marginBottom:"6px",background:"#EEF3FA",
            }}>
              <div style={{fontSize:"8.5px",fontWeight:"700",color:"#0F3D96",marginBottom:"4px",letterSpacing:"0.04em"}}>
                振り返りの問い
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:"3px"}}>
                {[
                  "この結果で、しっくりくるところはどこですか？",
                  "少し意外だったところはどこですか？",
                  "他の人と仕事を進めるとき、意識したいことは何ですか？",
                ].map((q,i)=>(
                  <div key={i} style={{display:"flex",gap:"5px",alignItems:"flex-start"}}>
                    <span style={{fontSize:"8px",fontWeight:"700",color:"#0F3D96",flexShrink:0,
                      marginTop:"1px"}}>{i+1}.</span>
                    <span style={{fontSize:"8.5px",color:"#2B2F33",lineHeight:"1.55"}}>{q}</span>
                  </div>
                ))}
              </div>
            </div>
            <p style={{fontSize:"7.5px",color:"#8898aa",textAlign:"center",margin:"0 0 3px",lineHeight:"1.6"}}>
              この結果は能力の高低ではなく、4象限の中での思考の相対的な使いやすさを示すものです。自己理解と対話のきっかけとして活用してください。
            </p>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontSize:"7.5px",color:"#aab"}}>思考特性 — Thinking Preferences</span>
              <span style={{fontSize:"7.5px",color:"#aab"}}>
                © {new Date().getFullYear()} Grow3 Inc. All rights reserved.　合計：{Object.values(scores).reduce((a,b)=>a+b,0)}点
              </span>
            </div>
          </div>
        </div>
      </>
    );
  }

  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
